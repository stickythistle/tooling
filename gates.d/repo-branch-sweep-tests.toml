[[gates]]
# The sweep deletes worktrees, so the suite pins its report and its prune
# against real git: an empty branch is empty, a landed branch with a clean
# worktree is pruned, and a worktree with uncommitted changes is skipped.
name = "repo-branch-sweep tests"
when = '^(bin/repo-branch-sweep|tests/test_repo_branch_sweep\.py)$'
run = "python3 tests/test_repo_branch_sweep.py"
