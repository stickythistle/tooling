# The implementer's identity, and the lane that must not use it.
#
# gh_as runs gh as the implementer, with that role's own credentials, and
# refuses when the role has none or when the login it would act as is
# absent from the binding. hermes-implement starts the lane with gh
# pointed at an empty config, so an accidental gh call fails.
#
# The gate names the suite, the module that holds gh_as, and the driver that
# starts the lane: a change to any of the three runs the suite that pins it.

[[gates]]
name = "credential-free lanes tests"
when = '^(tests/test_credential_free_lanes\.py|lib/common\.sh|bin/hermes-implement)$'
run = "python3 tests/test_credential_free_lanes.py"
