# The builder's disk guard: the space check before a build, the lane
# loop, and the _prove pairing. The gate names the suite and the tools
# it drives: builder-space is the check, remote-prune is the lane loop
# and the landing path, and remote-task is what runs the check before a
# sync.

[[gates]]
name = "builder space tests"
when = '^(tests/test_builder_space\.py|bin/builder-space|bin/remote-prune|bin/remote-task)$'
run = "python3 tests/test_builder_space.py"
