# gates.toml for the agent-tools checkout itself.
#
# A tool and the test that pins it share a `when`, so editing either runs the
# test. tests/test_gate_coverage.py fails when one does not.

[[gates]]
name = "task-mirror-check tests"
when = '^(bin/task-mirror-check|lib/workflow_steps\.py|tests/test_task_mirror_check\.py|lib/manifest\.py)$'
run = "python3 tests/test_task_mirror_check.py"

# A gate that always runs when the manifest reader or any bin/ tool moves.
# The reader is the foundation every other tool builds on; a change to a
# bin/ script can regress the way its output reaches bash, even when the
# script itself never touched the reader. We pin the refusal contract
# (missing field -> named error that survives `set -e`) rather than parsing
# the manifest's shape -- a parse is green against a manifest the reader
# would still reject.
[[gates]]
name = "manifest reader contract"
when = '^(lib/manifest\.py|tests/test_manifest\.py|bin/)'
run = "python3 tests/test_manifest.py"

[[gates]]
name = "gate-verify tests"
when = '^(bin/gate-verify|tests/test_gate_verify\.py)$'
run = "python3 tests/test_gate_verify.py"

[[gates]]
name = "pr-ready tests"
when = '^(bin/pr-ready|tests/test_pr_ready\.py|tests/fixtures/gh_.*\.json)$'
run = "python3 tests/test_pr_ready.py"

# The gate that decides what a PR needs. `lib/pr_gate.py` is in the
# `when` because moving the decision moves what the suite pins.
[[gates]]
name = "pr-loop-gate tests"
when = '^(bin/pr-loop-gate|lib/pr_gate\.py|tests/test_pr_loop_gate\.py|tests/fixtures/pr_gate/.*)$'
run = "python3 tests/test_pr_loop_gate.py"

# The parent-green comparison: whether a commit broke the branch it
# landed on. `lib/main_watch.py` is in the `when` because the decision is
# what the suite pins, and a change to it alone has to run the suite.
[[gates]]
name = "main watch tests"
when = '^(bin/main-watch|lib/main_watch\.py|tests/test_main_watch\.py)$'
run = "python3 tests/test_main_watch.py"

# The merge gate and its test. `merge-check` is the reviewer's last gate:
# the head sits on the current base, the change is the change that was
# reviewed, the commits are signed the way the repository asks, and CI
# has finished.

# It prints the command that merges the pull request. The decision is
# tested against recorded facts, so the suite needs no pull request.
# `lib/pr_gate.py` is in the `when` because the suite imports it, so a
# change to the decision the merge gate reads has to run the suite.
[[gates]]
name = "merge-check tests"
when = '^(bin/merge-check|lib/merge_check\.py|lib/pr_gate\.py|tests/test_merge_check\.py)$'
run = "python3 tests/test_merge_check.py"

# The same gate, over patches that real git produced. The suite above
# writes its patches by hand, and a hand-written patch can be written
# to agree with whatever the code under test does; this one builds the
# commits and reads the diffs back out of git. The `when` names the code
# under test as well as the suite (see tests/test_gate_coverage.py).
[[gates]]
name = "pr-loop-gate git tests"
when = '^(bin/pr-loop-gate|lib/pr_gate\.py|tests/test_pr_loop_gate_git\.py)$'
run = "python3 tests/test_pr_loop_gate_git.py"

# The caller that watches `main`: it judges every commit since the one
# it judged last and reports the breaks over Telegram. The gate names
# the driver and the suite that pins it, so a change to either runs the
# suite.
[[gates]]
name = "main watch run tests"
when = '^(bin/main-watch-run|tests/test_main_watch_run\.py|tests/fixtures/main_watch_run/.*)$'
run = "python3 tests/test_main_watch_run.py"

[[gates]]
name = "gates workflow"
when = '^(\.github/workflows/gates\.yaml|lib/workflow_steps\.py|tests/test_gates_workflow\.py)$'
run = "python3 tests/test_gates_workflow.py"

# The stack review: the driver, its two helper tools, the locating tool the
# attribution reads, and the attribution library the suite pins.
[[gates]]
name = "stack review tests"
when = '^(bin/hermes-review-pr|bin/stack-attrib|bin/stack-plan|bin/finding-check|lib/stack_attrib\.py|tests/test_review_stack\.py)$'
run = "python3 tests/test_review_stack.py"

[[gates]]
name = "lane-settled tests"
when = '^(bin/lane-settled|bin/hermes-implement|bin/gate-verify|tests/test_lane_settled\.py)$'
run = "python3 tests/test_lane_settled.py"

# Pins that hermes-implement gives each lane a private directory under
# AGENT_STATE_DIR (not /tmp) and exports it as TMPDIR/TMP/TEMP. The test
# runs the script end-to-end against a stub agent that reports where
# mktemp, tempfile, and the shell's tmpdir resolve, so the assertion is
# over what the lane actually saw, not over what the script's source
# looked like on paper.
[[gates]]
name = "hermes-implement tmpdir tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement_tmp\.py)$'
run = "python3 tests/test_hermes_implement_tmp.py"

[[gates]]
name = "lane-watch tests"
when = '^(bin/lane-watch|tests/test_lane_watch\.py)$'
run = "python3 tests/test_lane_watch.py"

[[gates]]
name = "hermes-implement tmux tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement_tmux\.py)$'
run = "python3 tests/test_hermes_implement_tmux.py"

[[gates]]
name = "tools-live-run tests"
when = '^(bin/tools-live-run|tests/test_tools_live_run\.py)$'
run = "python3 tests/test_tools_live_run.py"

[[gates]]
name = "remote-task drift tests"
when = '^(bin/remote-task|lib/migrator\.py|bin/task-mirror-check|lib/workflow_steps\.py|tests/test_remote_task_drift\.py)$'
run = "python3 tests/test_remote_task_drift.py"

[[gates]]
name = "remote path tests"
when = '^(bin/remote-task|bin/remote-run|lib/common\.sh|tests/test_remote_path\.py)$'
run = "python3 tests/test_remote_path.py"

[[gates]]
name = "remote lane tests"
when = '^(bin/remote-task|lib/common\.sh|hosts\.env\.example|tests/test_remote_lane\.py)$'
run = "python3 tests/test_remote_lane.py"

[[gates]]
name = "remote-prune tests"
when = '^(bin/remote-prune|tests/test_remote_prune\.py)$'
run = "python3 tests/test_remote_prune.py"

[[gates]]
name = "gate-prove tests"
when = '^(bin/gate-prove|tests/test_gate_prove\.py)$'
run = "python3 tests/test_gate_prove.py"

# install/ and pipeline/ ship shell with no suite. `bash -n` parses; it does not
# run, so a host that refuses to clone is unseen. `xargs -n1` is not incidental:
# test_gate_coverage.py rejects the forms that check one file or none.
[[gates]]
name = "install syntax"
when = '^install/.*\.sh$'
run = "find install -name '*.sh' -print0 | xargs -0 -n1 bash -n"

[[gates]]
name = "pipeline syntax"
when = '^pipeline/.*\.sh$'
run = "find pipeline -name '*.sh' -print0 | xargs -0 -n1 bash -n"

[[gates]]
name = "pick_lane tests"
when = '^(pipeline/pick_lane\.py|tests/test_pick_lane\.py)$'
run = "python3 tests/test_pick_lane.py"

# The manifest and its checker, run on any diff that adds a tool or a suite.
# That makes this `when` a catch-all over bin/ and tests/, which the PHONY
# probe correctly declines to count as coverage for any one of them.
[[gates]]
name = "gate coverage"
when = '^(gates\.toml|tests/test_gate_coverage\.py|bin/|tests/test_[^/]*\.py)'
run = "python3 tests/test_gate_coverage.py"

[[gates]]
name = "review phase tests"
when = '^(pipeline/(review|common|pick_lane)\.(sh|py)|lib/common\.sh|tests/test_review_phase\.py)$'
run = "python3 tests/test_review_phase.py"

# A behaviour pin for pipeline/triage.sh: the prompt reaches the
# agent via --query-file (so a 200 KB triage prompt does not hit
# MAX_ARG_STRLEN), a non-zero agent exit is reported on stdout, and
# a multi-word $PIPELINE_AGENT starts and runs end-to-end. `bash -n`
# parses; the suite proves behaviour.
[[gates]]
name = "triage phase tests"
when = '^(pipeline/(triage|common|pick_lane)\.(sh|py)|lib/common\.sh|tests/test_triage_phase\.py)$'
run = "python3 tests/test_triage_phase.py"

[[gates]]
name = "triage-on-merge tests"
when = '^(pipeline/triage-on-merge\.sh|bin/hermes-triage|tests/test_triage_on_merge\.py)$'
run = "python3 tests/test_triage_on_merge.py"

# Syntax floor for the eight bin/ tools that have no suite. Each gate names
# exactly the one file it parses: `bash -n a.sh b.sh` parses only the first
# and treats the rest as positional args, and `find -exec` does not propagate
# the exit status of what it runs, so the run has to be the per-file form.
# This establishes the file parses and nothing more -- real coverage would
# pin a behaviour, not a parse, and writing eight suites is a separate task.
[[gates]]
name = "findings-ledger tests"
when = '^(bin/findings-ledger|tests/test_findings_ledger\.py)$'
run = "python3 tests/test_findings_ledger.py"

[[gates]]
name = "gate-untested syntax"
when = '^(bin/gate-untested)$'
run = "bash -n bin/gate-untested"

[[gates]]
name = "hermes-doctor syntax"
when = '^(bin/hermes-doctor)$'
run = "python3 -m py_compile bin/hermes-doctor"

[[gates]]
name = "hermes-skills-sync syntax"
when = '^(bin/hermes-skills-sync)$'
run = "bash -n bin/hermes-skills-sync"

# The install that puts the repository's skills into the trees a lane loads
# them from. The check refuses a dispatch whose skill differs from the
# repository's copy. The suite runs against an isolated HERMES_HOME.
[[gates]]
name = "hermes-skills-sync tests"
when = '^(bin/hermes-skills-sync|lib/common\.sh|bin/hermes-implement|bin/agent-fix-pr|pipeline/review\.sh|install/live-checkout/setup\.sh|tests/test_hermes_skills_sync\.py)$'
run = "python3 tests/test_hermes_skills_sync.py"

[[gates]]
name = "hermes-triage syntax"
when = '^(bin/hermes-triage)$'
run = "bash -n bin/hermes-triage"

[[gates]]
name = "issue-grade syntax"
when = '^(bin/issue-grade)$'
run = "python3 -m py_compile bin/issue-grade"

[[gates]]
name = "pg-explain syntax"
when = '^(bin/pg-explain)$'
run = "bash -n bin/pg-explain"

[[gates]]
name = "redaction-check syntax"
when = '^(bin/redaction-check)$'
run = "bash -n bin/redaction-check"

[[gates]]
name = "repo-branch-sweep syntax"
when = '^(bin/repo-branch-sweep)$'
run = "bash -n bin/repo-branch-sweep"

[[gates]]
name = "hermes review tests"
# The suite drives the review script it runs and the driver that runs
# it -- which sources lib/common.sh, so a change to the shared helper is
# a change to what the suite exercises.
when = '^(skills/hermes-review/scripts/hermes-scrutinize\.sh|bin/hermes-review-pr|lib/common\.sh|tests/test_hermes_scrutinize\.py)$'
run = "python3 tests/test_hermes_scrutinize.py"

# The GPU group lock and its three contracts: serialise on one group, run
# across groups, no-op without one. Both common.sh's function and the
# helpers in bin/ and pipeline/ that call it.
[[gates]]
name = "GPU group lock tests"
when = '^(lib/common\.sh|tests/test_gpu_lock\.py|bin/hermes-implement|skills/hermes-review/scripts/hermes-scrutinize\.sh|pipeline/(common|triage|implement)\.sh)$'
run = "python3 tests/test_gpu_lock.py"

# hermes_query is the lib/common.sh helper every tool uses to hand hermes
# its prompt as a file (`--query-file PATH`) instead of one argv string
# (`-z "$prompt"`). The test pins: a 200 KB prompt with quotes/$()/
# backticks reaches the agent byte-for-byte, the `session_id:` line that
# `chat -Q` writes is dropped before callers see stdout, and fd 8 stays
# open so the GPU lock spans retries.
[[gates]]
name = "hermes_query tests"
when = '^(lib/common\.sh|tests/test_hermes_query\.py)$'
run = "python3 tests/test_hermes_query.py"

# hermes-implement takes the GPU group lock once and holds it across every
# retry, so a flapping model cannot race itself across GPUs. The suite
# also pins the resume policy (retry until clean + HANDOVER.md; the
# resume prompt names the committed and uncommitted work; a 124 leaves
# the run unfinished).
[[gates]]
name = "hermes-implement lock-across-retry tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement\.py)$'
run = "python3 tests/test_hermes_implement.py"

# A run that was meant to make no commit, and the count on the FAILED
# line. The suite names the tool, because the verdict and the brief the
# lane is handed are both the tool's.
[[gates]]
name = "hermes-implement no-commit tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement_nocommit\.py)$'
run = "python3 tests/test_hermes_implement_nocommit.py"

# The builder's disk guard: the space check before a build, the lane
# loop, and the _prove pairing. The gate names the suite and the tools
# it drives: builder-space is the check, remote-prune is the lane loop
# and the landing path, and remote-task is what runs the check before a
# sync.
[[gates]]
name = "builder space tests"
when = '^(tests/test_builder_space\.py|bin/builder-space|bin/remote-prune|bin/remote-task)$'
run = "python3 tests/test_builder_space.py"

# The execution review lane: a reviewer that runs the code, and every
# finding it reports carries the command that reproduces it. The gate names
# the driver, the module it drives and the driver that owns the phase.
[[gates]]
name = "review-execute tests"
when = '^(bin/review-execute|lib/review_execute\.py|bin/hermes-review-pr|tests/test_review_execute\.py)$'
run = "python3 tests/test_review_execute.py"

# A retried attempt resumes this run's session, by name. A bare
# `--continue` lets the CLI pick the session -- its breadcrumb, or the
# most recent one in the workspace, or the most recent one anywhere --
# so two runs in one worktree can resume each other's session. The run
# fixes the name before the first attempt, because the session id the
# agent reports is gone on an attempt the timeout killed.
[[gates]]
name = "hermes-implement session resume tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement_session\.py)$'
run = "python3 tests/test_hermes_implement_session.py"

# The implementer's identity, and the lane that must not use it.
#
# gh_as runs gh as the implementer, with that role's own credentials, and
# refuses when the role has none or when the login it would act as is not
# one of IMPLEMENTER_LOGINS. hermes-implement starts the lane with gh
# pointed at an empty config, so an accidental gh call fails.
#
# The gate names the suite, the module that holds gh_as, and the driver that
# starts the lane: a change to any of the three runs the suite that pins it.
[[gates]]
name = "credential-free lanes tests"
when = '^(tests/test_credential_free_lanes\.py|lib/common\.sh|bin/hermes-implement)$'
run = "python3 tests/test_credential_free_lanes.py"

# Syntax floor for the two review drivers; their shared logic is in
# lib/common.sh and the review script, which the suite above pins.
[[gates]]
name = "hermes-review-pr syntax"
when = '^(bin/hermes-review-pr)$'
run = "bash -n bin/hermes-review-pr"

[[gates]]
name = "review-execute syntax"
when = '^(bin/review-execute)$'
run = "bash -n bin/review-execute"

[[gates]]
name = "hermes-review-sweep syntax"
when = '^(bin/hermes-review-sweep)$'
run = "bash -n bin/hermes-review-sweep"

# The squash tool and its test. The test exercises the bug from
# issue #68 directly: a base ref that has moved between fork and squash
# must leave the branch's tree unchanged. `bash -n` parses; the suite
# proves behaviour.
[[gates]]
name = "squash tests"
when = '^(bin/squash|tests/test_squash\.py)$'
run = "python3 tests/test_squash.py"

[[gates]]
name = "find_prose tests"
when = '^(skills/condense-prose/find_prose\.py|tests/test_find_prose\.py)$'
run = "python3 tests/test_find_prose.py"

# The condense pass's protection of skill files: the finder marks them, the
# skill says what cannot be cut, and the coordinator checks the pass before
# approving.
#
# The gate names the suite and the files it pins: the finder, and the two
# skills whose prose the protection is about.
[[gates]]
name = "condense skill protection tests"
when = '^(tests/test_condense_skill_protection\.py|skills/condense-prose/find_prose\.py|skills/condense-prose/SKILL\.md|skills/pr-review-coordinator/SKILL\.md)$'
run = "python3 tests/test_condense_skill_protection.py"

[[gates]]
name = "finding-check tests"
when = '^(bin/finding-check|tests/test_finding_check\.py)$'
run = "python3 tests/test_finding_check.py"

# The fakes that run git on a path from their arguments, and the lane
# skills that say an experiment belongs in a scratch copy. The gate
# names the test files whose fakes are guarded and the two skills that
# carry the rule, so a change to any of them runs the suite that pins
# them.
[[gates]]
name = "fake guards tests"
when = '^(tests/test_fake_guards\.py|tests/test_agent_fix_pr\.py|tests/test_lane_rustc\.py|tests/test_lane_settled\.py|skills/swe-updater/SKILL\.md|skills/swe-review-fix/SKILL\.md)$'
run = "python3 tests/test_fake_guards.py"

# The verification pass between finding-check and the decider. The suite
# exercises the allow-list, the known-answer control and every way a model
# can answer badly; a stub stands in for the model, so the gate never calls
# one.
[[gates]]
name = "finding-verify tests"
when = '^(bin/finding-verify|tests/test_finding_verify\.py)$'
run = "python3 tests/test_finding_verify.py"

# The brief: a written brief reaches the lane as a file, whole, and the
# run keeps it. The gate names the driver, because the brief is the
# driver's own option and the run directory it lands in.
[[gates]]
name = "hermes-implement brief tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement_brief\.py)$'
run = "python3 tests/test_hermes_implement_brief.py"

[[gates]]
name = "push-guard tests"
when = '^(bin/push-guard|hooks/pre-push|tests/test_push_guard\.py)$'
run = "python3 tests/test_push_guard.py"

[[gates]]
name = "lane rustc tests"
when = '^(lib/lane-rustc|lib/common\.sh|lib/manifest\.py|bin/hermes-implement|pipeline/implement\.sh|tests/test_lane_rustc\.py|tests/test_hermes_implement_tmp\.py)$'
run = "python3 tests/test_lane_rustc.py"

[[gates]]
name = "lane identity scope tests"
when = '^(lib/common\.sh|bin/hermes-implement|bin/agent-fix-pr|pipeline/implement\.sh|tests/test_lane_identity_scope\.py)$'
run = "python3 tests/test_lane_identity_scope.py"

[[gates]]
name = "agent-fix-pr tests"
when = '^(bin/agent-fix-pr|tests/test_agent_fix_pr\.py)$'
run = "python3 tests/test_agent_fix_pr.py"
